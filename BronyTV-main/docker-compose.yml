services:
  db:
    image: postgres:16-alpine
    container_name: brony-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: BronyTV
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BronyTV"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      brony-net:
        aliases:
          - db

  backend:
    build:
      context: .
      dockerfile: BronyTV/Dockerfile
    container_name: brony-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./media:/app/media:ro
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    environment:
      DISABLE_HTTPS_REDIRECT: "true"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      VideoStorage__RootPath: /app/media
      BRONYTV_VIDEOS_ROOT: /app/media
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=BronyTV;Username=postgres;Password=${POSTGRES_PASSWORD:-123456}"
      Jwt__Key: ${JWT_KEY:-SuperSecretBronyTVKey_ChangeMeInProduction!}
      Jwt__Issuer: BronyTV
      Jwt__Audience: BronyTV
      Jwt__SessionDays: "7"
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUser: ${EMAIL_SMTP_USER:-}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD:-}
      Email__SmtpUseSsl: ${EMAIL_SMTP_USE_SSL:-true}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@bronytv.ru}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:8080}
      Cors__AllowedOrigins__1: https://bronytv.ru
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    restart: unless-stopped
    networks:
      brony-net:
        aliases:
          - backend

  frontend:
    build:
      context: .
      dockerfile: Brony_Video-main/Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api
    container_name: brony-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    restart: always
    networks:
      brony-net:
        aliases:
          - frontend

networks:
  brony-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  dataprotection_keys:
    driver: local
