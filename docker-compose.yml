services:
  db:
    image: postgres:16-alpine
    container_name: brony-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: BronyTV
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BronyTV"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - brony-net

  brony-backend:
    build:
      context: .
      dockerfile: BronyTV/Dockerfile
    container_name: brony-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./media:/app/media:ro
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    environment:
      - DISABLE_HTTPS_REDIRECT=true
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - VideoStorage__RootPath=/app/media
      - BRONYTV_VIDEOS_ROOT=/app/media
            - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=BronyTV;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - Jwt__Issuer=BronyTV
      - Jwt__Audience=BronyTV
      - Jwt__SessionDays=7
      # Shared secret protecting internal server-to-server endpoints (see InternalActivityController).
      - BRONYTV_INTERNAL_KEY=${BRONYTV_INTERNAL_KEY:-}
      - Admin__BootstrapLogin=${ADMIN_BOOTSTRAP_LOGIN:-}
      - Admin__BootstrapPassword=${ADMIN_BOOTSTRAP_PASSWORD:-}
      - Admin__PrivilegedEmails__0=${ADMIN_EMAIL:-}
      - Admin__OwnerEmails__0=${OWNER_EMAIL:-}
      - Email__SmtpHost=${EMAIL_SMTP_HOST:-smtp.gmail.com}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-587}
      - Email__SmtpUser=${EMAIL_SMTP_USER:?Set EMAIL_SMTP_USER in .env}
      - Email__SmtpUsername=${EMAIL_SMTP_USER:?Set EMAIL_SMTP_USER in .env}
      - Email__SmtpPassword=${EMAIL_SMTP_PASSWORD:?Set EMAIL_SMTP_PASSWORD in .env}
      # MailKit uses explicit STARTTLS when this value is true.
      - Email__SmtpUseSsl=${EMAIL_SMTP_USE_SSL:-true}
      - Email__EnableSsl=${EMAIL_SMTP_USE_SSL:-true}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in .env}
      - Email__SenderEmail=${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS in .env}
      - Email__SenderName=${EMAIL_SENDER_NAME:-BronyTV}
      # BronyVPN (3X-UI integration). Unless VPN_ENABLED=true, the section stays hidden.
      - Vpn__Enabled=${VPN_ENABLED:-false}
      - Vpn__ServerHost=${VPN_SERVER_HOST:-}
      - Vpn__ServerPort=${VPN_SERVER_PORT:-443}
      - Vpn__VlessParameters=${VPN_VLESS_PARAMETERS:-}
            - Vpn__PanelBaseUrl=${VPN_PANEL_BASE_URL:-}
            - Vpn__PanelApiUrl=${VPN_PANEL_API_URL:-}
      - Vpn__PanelApiToken=${VPN_PANEL_API_TOKEN:-}
      - Vpn__PanelInboundId=${VPN_PANEL_INBOUND_ID:-}
      - Vpn__ClientDomain=${VPN_CLIENT_DOMAIN:-}
      - Vpn__TrialDays=${VPN_TRIAL_DAYS:-14}
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN:-https://bronytv.ru}
      - Cors__AllowedOrigins__1=http://localhost:8080
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-https://bronytv.ru}
    restart: unless-stopped
    networks:
      - brony-net

  aibronytv:
    build:
      context: .
      dockerfile: AiBronyTV/Dockerfile
    container_name: aibronytv
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - POSTGRES_HOST=db
      - POSTGRES_DB=BronyTV
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in .env}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_ENDPOINT=${DEEPSEEK_ENDPOINT:-https://api.deepseek.com/v1}
            # Must match brony-backend so the AI service can validate the HttpOnly session cookie.
      - Jwt__Key=${JWT_KEY:?Set JWT_KEY in .env}
      - Jwt__Issuer=BronyTV
      - Jwt__Audience=BronyTV
      # Server-to-server: базовый URL основного бэкенда и общий внутренний ключ.
      - BRONYTV_BACKEND_URL=http://brony-backend:5000
      - BRONYTV_INTERNAL_KEY=${BRONYTV_INTERNAL_KEY:-}
    restart: unless-stopped
    networks:
      - brony-net

  frontend:
    build:
      context: ./Brony_Video-main
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: /api
    container_name: brony-frontend
    depends_on:
      db:
        condition: service_started
      brony-backend:
        condition: service_started
    ports:
      - "80:80"
    # Direct video serving by nginx (bypasses Kestrel for large files).
    volumes:
      - ./media:/usr/share/nginx/html/media:ro
    restart: always
    networks:
      - brony-net

networks:
  brony-net:
    driver: bridge

volumes:
  postgres_data:
  dataprotection_keys: